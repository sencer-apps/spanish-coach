<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1f2937;--mut:#6b7280;--pri:#4f46e5;--pri2:#eef2ff;--ok:#059669;--bad:#dc2626;--line:#e5e7eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding:max(12px,env(safe-area-inset-top)) 14px calc(76px + env(safe-area-inset-bottom))}
#app{max-width:560px;margin:0 auto}
h1{font-size:24px;margin:6px 0 2px}h2{font-size:19px;margin:14px 0 8px}
.sub{color:var(--mut);font-size:14px;margin:0 0 10px}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:11px 14px;background:var(--pri);color:#fff;font-weight:600}
button.ghost{background:var(--pri2);color:var(--pri)}button.sm{padding:7px 11px;font-size:14px;min-width:40px;min-height:36px}
button:disabled{opacity:.5}
.chip{background:var(--pri2);color:var(--pri);padding:8px 13px;border-radius:999px;font-weight:600;font-size:15px}
.chip.sel{background:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid button{padding:16px 10px;text-align:center}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;background:none;color:var(--mut);font-size:12px;padding:6px 2px;border-radius:10px}nav button b{display:block;font-size:20px}nav button.on{color:var(--pri);background:var(--pri2)}
.flash{min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;cursor:pointer}
.flash .w{font-size:34px;font-weight:800}.flash .e{color:var(--mut);font-style:italic}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--line);margin:8px 0}
.opt.ok{border-color:var(--ok);background:#ecfdf5}.opt.bad{border-color:var(--bad);background:#fef2f2}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
#msgs{display:flex;flex-direction:column;gap:8px;min-height:240px}
.m{max-width:88%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;line-height:1.4}
.m.ai{background:#fff;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.08)}.m.me{background:var(--pri);color:#fff;align-self:flex-end}
.m.tip{background:#fffbeb;color:#92400e;align-self:flex-start;font-size:14px;border:1px solid #fde68a}
textarea{width:100%;font:inherit;border:2px solid var(--line);border-radius:12px;padding:10px;resize:none}
.lv{display:inline-block;background:var(--pri);color:#fff;border-radius:8px;padding:2px 9px;font-weight:800}
.small{font-size:13px;color:var(--mut)}
.wd,.wt{transition:background .12s,box-shadow .12s}.wd.on{background:#fde047;box-shadow:0 0 0 2px #fde047;border-radius:4px;color:#111}.wt.on{background:#86efac;box-shadow:0 0 0 2px #86efac;border-radius:4px;color:#111}
.tk{}.vr{transition:background .12s}.vr.on{background:#bbf7d0;border-radius:6px}.tn{border-radius:6px;transition:background .12s}
.wd.sel,.sn.sel,[id^=ln].sel{outline:2px solid #f59e0b;border-radius:6px}#rdt .wd,[id^=ln] .wd{cursor:pointer}

  if(TTS){TTS.speak(t,{language:'en'}).catch(()=>{});return;}
  if(canWeb){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';pv(u);u.rate=r||.8;clearTimeout(window.__sy);window.__sy=setTimeout(()=>{try{speechSynthesis.resume();speechSynthesis.speak(u);}catch(e){}},180);}catch(e){}}
}

const VL='es-ES';let VOICES=[];

function vScore(v){const n=(v.name||'').toLowerCase();let s=0;if(/natural|neural|premium|enhanced|wavenet/.test(n))s+=50;if(/google/.test(n))s+=30;if(/espeak|compact/.test(n))s-=50;if(v.lang.replace('_','-').toLowerCase()===VL.toLowerCase())s+=10;if(v.localService===false)s+=5;return s;}
function vList(){const p=VL.slice(0,2).toLowerCase();return VOICES.filter(v=>v.lang.replace('_','-').toLowerCase().startsWith(p)).sort((a,b)=>vScore(b)-vScore(a));}

  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.v;render();});}

let qz=null;
function mkQs(words,lv,n){
  const d=shuffle(words).slice(0,n),pool=Object.values(DECK).map(t=>t[lv]).flat();
  const qs=d.map((w,i)=>{
    const t=i%3;const sn=new Set([w.tr]);const others=shuffle(pool.filter(x=>x.w!==w.w)).filter(x=>x.tr&&!sn.has(x.tr)&&sn.add(x.tr));
    if(t===0)return {q:`“${w.w}” ne demek?`,a:w.tr,o:shuffle([w.tr,...others.slice(0,3).map(x=>x.tr)]),say:w.w};
    if(t===1)return {q:`“${w.tr}” İspanyolcada hangisi?`,a:w.w,o:shuffle([w.w,...others.slice(0,3).map(x=>x.w)]),say:w.w};
    const re=new RegExp(w.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
    const cl=re.test(w.ex)?w.ex.replace(re,'_____'):null;
    if(!cl)return {q:`“${w.w}” ne demek?`,a:w.tr,o:shuffle([w.tr,...others.slice(0,3).map(x=>x.tr)]),say:w.w};
    return {q:`Boşluğu doldur: ${cl}`,a:w.w,o:shuffle([w.w,...others.slice(0,3).map(x=>x.w)]),say:w.ex};
  });
  return qs;
}
function mkQuiz(){const dk=deck(),un=dk.filter(x=>!S.known[x.w]);qz={qs:mkQs(un.length>=10?un:dk,S.lvl,10),i:0,c:0,done:false,lock:false};}

function duelHost(name,n=0){
  duelLeave();const code=String(1000+Math.floor(Math.random()*9000));let peer;

function duelJoin(name,code){

  const fail=t=>{if(DU!==d)return;duelLeave();dmsg(t);};

const FU=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const FT={3:'treinta',4:'cuarenta',5:'cincuenta',6:'sesenta',7:'setenta',8:'ochenta',9:'noventa'};
const FH=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
function fr100(n,ap){ // 0..99; ap: "uno" -> "un" (isimden önce)
  if(n<30){const w=FU[n];return ap?(n===1?'un':n===21?'veintiún':w):w;}
  const t=Math.floor(n/10),u=n%10;return FT[t]+(u===0?'':' y '+(ap&&u===1?'un':FU[u]));
}
function fr1000(n,ap){ // 0..999
  const h=Math.floor(n/100),r=n%100;
  if(n===100)return 'cien';
  let s=h>0?FH[h]:'';
  if(r>0)s+=(s?' ':'')+fr100(r,ap);
  return s;
}
function numW(n){
  if(n===0)return 'cero';
  const parts=[];let m=Math.floor(n/1e6),k=Math.floor((n%1e6)/1000),r=n%1000;
  if(m>0)parts.push(m===1?'un millón':fr1000(m,true)+' millones');
  if(k>0)parts.push(k===1?'mil':fr1000(k,true)+' mil');
  if(r>0)parts.push(fr1000(r,false));
  return parts.join(' ').replace(/\s+/g,' ').trim();
}
const ORD=['','primero','segundo','tercero','cuarto','quinto','sexto','séptimo','octavo','noveno','décimo'];
function ordW(n){return ORD[n]||numW(n);}
const ordN=n=>n+'.º';
const fmtN=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const NDAY=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const NMON=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function yrW(y){return numW(y);}
function timeW(h,m){const nx=h%12+1,hh=h%12||12,H=x=>x===1?'la una':'las '+numW(x),V=x=>x===1?'Es ':'Son ';
  if(m===0)return V(hh)+H(hh);if(m===15)return V(hh)+H(hh)+' y cuarto';if(m===30)return V(hh)+H(hh)+' y media';if(m===45)return V(nx)+H(nx)+' menos cuarto';
  return m<30?V(hh)+H(hh)+' y '+numW(m):V(nx)+H(nx)+' menos '+numW(60-m);}
const tFmt=(h,m)=>h+':'+String(m).padStart(2,'0');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pickN=(a,arr)=>arr[rnd(0,arr.length-1)];
function uniq(c,mk){const s=new Set([c]);let g=0;while(s.size<4&&g++<60){const v=mk();if(v!==undefined&&v!==null&&v!=='')s.add(v);}return [...s];}
function numQ(lv){
  const mx={A1:100,A2:1000,B1:100000,B2:1000000,C1:999999999,C2:999999999}[lv],big=(lv==='C1'||lv==='C2');
  const T=['n','w'];if(lv==='A1')T.push('day','mon','t');
  if(lv==='A2')T.push('t','date','day','mon','ph');

  const t=pickN(0,T);
  const gen=()=>{if(lv==='A1')return rnd(0,100);const e=rnd(1,Math.max(1,Math.floor(Math.log10(mx))));return rnd(Math.max(0,Math.pow(10,e-1)),Math.min(mx,Math.pow(10,e)));};
  const near=n=>{const k=rnd(0,4);return k===0?n+rnd(1,9):k===1?Math.max(0,n-rnd(1,9)):k===2?n+10*rnd(1,5):k===3?Math.max(0,n-10*rnd(1,5)):(n>=70&&n<100?n-10:+String(n).split('').reverse().join('')||n+1);};
  if(t==='n'||t==='w'){const n=gen();const ds=uniq(n,()=>near(n)).filter(x=>x<=mx*10);
    if(t==='n'){const o=ds.map(numW);return {q:`<span style="font-size:30px;font-weight:800">${fmtN(n)}</span><div class="small">İspanyolca okunuşu hangisi?</div>`,say:null,a:numW(n),o:shuffle(o),mq:fmtN(n)+' = ?'};}
    return {q:'🔊 Duyduğun sayı hangisi?',say:numW(n),a:fmtN(n),o:shuffle(ds.map(fmtN)),mq:'🔊 "'+numW(n)+'" = ?'};}
  if(t==='day'||t==='mon'){const A=t==='day'?NDAY:NMON,L=A.length,i=rnd(0,L-1),f=Math.random()<.5,a=A[(i+(f?1:L-1))%L];
    return {q:`<b style="font-size:20px">${f?'Después de':'Antes de'} ${A[i]}, c'est…</b><div class="small">${t==='day'?'gününden':'ayından'} ${f?'sonra':'önce'} hangisi gelir?</div>`,a,o:shuffle(uniq(a,()=>pickN(0,A))),mq:(f?'Después de ':'Antes de ')+A[i]+' = ?'};}
  if(t==='t'||t==='tr'){const MS=lv==='A1'?[0,30]:[0,5,10,15,20,25,30,35,40,45,50,55],h=rnd(1,12),m=t==='tr'?rnd(1,59):pickN(0,MS),w=timeW(h,m);

  if(t==='ord'){const n=rnd(1,10);return {q:`<span style="font-size:30px;font-weight:800">${ordN(n)}</span><div class="small">İspanyolca okunuşu hangisi?</div>`,a:ordW(n),o:shuffle(uniq(ordW(n),()=>ordW(Math.max(1,Math.min(10,n+rnd(-4,4)))))),mq:ordN(n)+' = ?'};}
  if(t==='date'){const dd=d=>d===1?'primero':numW(d),d=rnd(1,28),m=rnd(0,11),a='el '+dd(d)+' de '+NMON[m];return {q:`<span style="font-size:26px;font-weight:800">${d} ${NMON[m]}</span><div class="small">Tarih nasıl söylenir?</div>`,a,o:shuffle(uniq(a,()=>'el '+dd(Math.max(1,Math.min(28,d+rnd(-3,3))))+' de '+NMON[Math.random()<.5?m:rnd(0,11)])),mq:d+' '+NMON[m]+' = ?'};}
  if(t==='yr'){const y=pickN(0,[rnd(1900,1999),rnd(2000,2030),rnd(1500,1899)]);return {q:`<span style="font-size:32px;font-weight:800">${y}</span><div class="small">Yıl nasıl okunur?</div>`,a:yrW(y),o:shuffle(uniq(yrW(y),()=>yrW(y+pickN(0,[-10,-1,1,10,-100,100,9,-9])))),mq:y+' = ?'};}
  if(t==='ph'){const pr=['60','61','62','63','65','66','67','69'],d=[pickN(0,pr)];for(let i=0;i<4;i++)d.push(String(rnd(0,99)).padStart(2,'0'));
    const rd=a=>a.map(x=>x==='00'?'cero cero':x[0]==='0'?'cero '+numW(+x[1]):numW(+x)).join(', ');
    const w=rd(d),a=d.join(' ');return {q:'🔊 Telefon numarası: hangisini duydun?',say:w,a,o:shuffle(uniq(a,()=>{const e=d.slice();e[rnd(1,4)]=String(rnd(0,99)).padStart(2,'0');return e.join(' ');})),mq:'🔊 "'+w+'" = ?'};}
}

const ACC=/(?!)/g;
let WR=null;
function rWri(){
  const hd=`<button class="ghost sm" id="bk">← Çalış</button>`;
  if(!WR)WR={l:S.lvl,i:-1};
  const lv=WRI.filter(x=>x[0]===WR.l);
  const lc=`<div class="row">${LEVELS.map(l=>`<button class="chip ${l===WR.l?'sel':''}" data-lv="${l}">${l}</button>`).join('')}</div>`;
  const wl=()=>document.querySelectorAll('[data-lv]').forEach(b=>b.onclick=()=>{WR={l:b.dataset.lv,i:-1};rWri();});
  if(WR.i<0){
    $('#app').innerHTML=hd+`<h2>📝 Yazma Pratiği</h2><p class="sub">Bir konu seç, İspanyolca yaz. Uygulama gerekli öğeleri ve aksanları kontrol eder, ardından örnek metni gösterir.</p>${lc}`+(lv.length?lv.map((x,i)=>`<button class="ghost" data-i="${i}" style="width:100%;text-align:left;margin-bottom:6px">${esc(x[1])}<br><span class="small">En az ${x[2]} kelime</span></button>`).join(''):'<div class="card">Bu seviye için henüz konu yok. Başka bir seviye seç.</div>');
    $('#bk').onclick=toWork;wl();document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{WR={l:WR.l,i:+b.dataset.i,res:null,txt:''};rWri();});return;}
  const x=lv[WR.i],r=WR.res;
  $('#app').innerHTML=`<button class="ghost sm" id="bk">← Konular</button><h2>📝 ${esc(x[0])}</h2><div class="card"><b>${esc(x[1])}</b><div class="small">En az ${x[2]} kelime yaz.</div></div>
  <textarea id="tx" rows="7" style="width:100%;padding:10px;font-size:16px;border-radius:10px;border:1px solid var(--line);box-sizing:border-box" placeholder="İspanyolca yaz…" spellcheck="false" autocapitalize="sentences">${esc(WR.txt||'')}</textarea>
  <div class="row"><button id="ck">✅ Kontrol et</button></div>
  ${r?`<div class="card"><div style="font-size:18px;font-weight:700">${r.words} kelime ${r.words>=x[2]?'✅':'⚠️ (en az '+x[2]+')'}</div><div style="margin-top:8px">${r.items.map(i=>`<div>${i.ok?'✅':'⬜'} ${esc(i.n)}</div>`).join('')}</div>${r.acc.length?`<p class="small" style="margin-top:8px">🔎 Aksan eksik olabilir: <b>${esc(r.acc.join(', '))}</b></p>`:''}</div>
  <div class="card" style="background:#f8fafc"><b>Örnek metin</b><p style="margin:6px 0">${esc(x[4])}</p><button class="ghost sm" id="pl">🔊 Dinle</button></div><div class="row"><button class="ghost" id="rs">Yeniden yaz</button><button id="nx">Başka konu ➜</button></div>`:''}`;
  $('#bk').onclick=()=>{WR={l:WR.l,i:-1};rWri();};
  $('#ck').onclick=()=>{const t=$('#tx').value;if(t.trim().length<3)return;const n=' '+normW(t).join(' ')+' ';
    const items=x[3].map(g=>({n:g[0],ok:g.slice(1).some(k=>n.includes(' '+k))}));
    const acc=[...new Set((t.toLowerCase().match(ACC)||[]))];
    const words=t.trim().split(/\s+/).length;
    WR.res={words,items,acc};WR.txt=t;const got=items.filter(i=>i.ok).length;
    if(words>=x[2]&&got>=Math.ceil(items.length*.75)){xpa(5);cnt('wri');bump(5);save();}else xpa(1);
    rWri();};
  if($('#pl'))$('#pl').onclick=()=>say(x[4],.8);
  if($('#rs'))$('#rs').onclick=()=>{WR.res=null;rWri();};
  if($('#nx'))$('#nx').onclick=()=>{WR={l:WR.l,i:(WR.i+1)%lv.length,res:null,txt:''};rWri();};
}

const PLN=[
["🔁 Aralıklı tekrar (zamanı gelenler + 10 yeni)","srs",()=>{SR2=null;}],
["👂 Dinle ve Yaz: bir set","dict",()=>{DX=null;}],
["🎭 Bir gündelik durum canlandır","sen",()=>{SN=null;}],
["🗣️ Telaffuz: bir ses grubu","pron",()=>{PN=null;}],
["🎧 Bir dinleme metni","lis",()=>{LS=null;}],
["📰 Bir kısa metin oku","rdy",()=>{RDY=null;}],
];
function rPlan(){
  const k=dayKey(new Date());if(!S.plan||S.plan.d!==k)S.plan={d:k,x:[],p:0};
  const done=S.plan.x,n=PLN.length;
  $('#app').innerHTML=`<button class="ghost sm" id="bk">← Çalış</button><h2>📅 Bugünün Planı</h2><p class="sub">Yaklaşık 15 dakika. Bitirdikçe işaretle.</p><div class="bar"><i style="width:${done.length/n*100}%"></i></div>`+PLN.map((p,i)=>`<div class="card" style="display:flex;gap:10px;align-items:center;${done.includes(i)?'opacity:.6':''}"><button class="ghost sm" data-c="${i}" style="min-width:42px">${done.includes(i)?'✅':'⬜'}</button><div style="flex:1">${esc(p[0])}</div><button class="sm" data-o="${i}">Aç</button></div>`).join('')+(done.length>=n?`<div class="card" style="text-align:center;background:#ecfdf5"><b>🎉 Bugünkü planı bitirdin!</b></div>`:'');
  $('#bk').onclick=toWork;
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const i=+b.dataset.c,j=done.indexOf(i);if(j>=0)done.splice(j,1);else done.push(i);if(done.length>=n&&!S.plan.p){S.plan.p=1;bump(10);}save();rPlan();});
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const p=PLN[+b.dataset.o];p[2]();view=p[1];render();});
}

function kqStart(si){
  const all=[];KAL.forEach((c,ci)=>c.y.concat(c.h).forEach(p=>all.push({p,ci})));
  const pool=si<0?all:all.filter(a=>a.ci===si);
  const qs=shuffle(pool.slice()).slice(0,si<0?10:Math.min(8,pool.length)).map(a=>{
    const d=shuffle(all.filter(b=>b.p[0]!==a.p[0])).slice(0,3).map(b=>b.p[0]);
    return {sc:KAL[a.ci].t,tr:a.p[1],ans:a.p[0],opts:shuffle([a.p[0]].concat(d))};});
  KQ={si,qs,k:0,ok:0,first:true,done:false};view='kq';render();
}

let GP=null;
function gapMake(){
  const ex=spkExtra().filter(x=>x.tr&&x.en.split(/\s+/).length>=4&&x.en.split(/\s+/).length<=12);
  const strip=w=>w.replace(/^[^A-Za-zÀ-ÿœŒ]+|[^A-Za-zÀ-ÿœŒ]+$/g,'');
  const cand=[];ex.forEach(x=>{x.en.split(/\s+/).forEach(w=>{const c=strip(w);if(c.length>=4&&!/['’-]/.test(c))cand.push(c.toLowerCase());});});
  const uniq=[...new Set(cand)];
  const items=[];
  shuffle(ex.slice()).forEach(x=>{if(items.length>=10)return;
    const ws=x.en.split(/\s+/),ix=ws.map((w,i)=>[w,i]).filter(a=>{const c=strip(a[0]);return c.length>=4&&!/['’-]/.test(c);});
    if(!ix.length)return;const [w,i]=pick(ix),c=strip(w),lc=c.toLowerCase();
    const sc=u=>(u.slice(-3)===lc.slice(-3)?3:u.slice(-2)===lc.slice(-2)?2:u.slice(-1)===lc.slice(-1)?1:0)*2-Math.abs(u.length-lc.length)*0.5+Math.random()*1.5;
    const prev=i>0?strip(ws[i-1]).toLowerCase():'';
    const ds=uniq.filter(u=>u!==lc&&Math.abs(u.length-lc.length)<=3&&u[0]!==lc[0]&&!(prev&&u===prev)).sort((a,b)=>sc(b)-sc(a)).slice(0,3);if(ds.length<3)return;
    const cap=c[0]!==lc[0];const f=s=>cap?s[0].toUpperCase()+s.slice(1):s;
    const q=ws.map((t,j)=>j===i?t.replace(c,'_____'):t).join(' ');
    items.push({q,tr:x.tr,fr:x.en,a:f(lc),o:shuffle([f(lc)].concat(ds.map(f)))});});
  return items;
}

const ITP_L={lc:'es-ES',tl:'es',n:'İspanyolca',fl:'🇪🇸'};
// ---- Çevirmen (ardışık çeviri): konuşma → çeviri → sesli okuma ----
let ITP=null,ITR=null;
function itpTTS(t,lang){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=lang;const vs=(speechSynthesis.getVoices()||[]).filter(v=>String(v.lang).toLowerCase().replace('_','-').startsWith(lang.slice(0,2).toLowerCase()));if(vs[0])u.voice=vs[0];u.rate=.95;speechSynthesis.speak(u);}catch(e){}}
async function itpTr(text,from,to){
  try{if(self.Translator&&Translator.availability){const av=await Translator.availability({sourceLanguage:from,targetLanguage:to});if(av==='available'){const r=await Promise.race([(async()=>{const tr=await Translator.create({sourceLanguage:from,targetLanguage:to});return await tr.translate(text);})(),new Promise((_,rej)=>setTimeout(()=>rej(0),4000))]);if(r)return{t:r,via:'cihaz'};}}}catch(e){}
  const tmo=async(url)=>{const c=new AbortController();const id=setTimeout(()=>c.abort(),7000);try{const r=await fetch(url,{signal:c.signal});return await r.json();}finally{clearTimeout(id);}};
  try{const j=await tmo('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+from+'&tl='+to+'&dt=t&q='+encodeURIComponent(text));const o=(j[0]||[]).map(x=>x[0]).join('');if(o)return{t:o,via:'çevrimiçi'};}catch(e){}
  try{const j=await tmo('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+from+'|'+to);const o=j&&j.responseData&&j.responseData.translatedText;if(o)return{t:o,via:'çevrimiçi 2'};}catch(e){}
  return null;}
async function itpDo(text,dir){
  text=String(text||'').trim();if(!text)return;
  const from=dir==='x'?ITP_L.tl:'tr',to=dir==='x'?'tr':ITP_L.tl;
  ITP.busy=true;ITP.msg='';rItp();
  const r=await itpTr(text,from,to);
  ITP.busy=false;ITP.listening=null;
  if(!r){ITP.msg='Çeviri yapılamadı. İnternet bağlantını kontrol et ve tekrar dene.';rItp();return;}
  ITP.log.unshift({dir,src:text,out:r.t,via:r.via});ITP.log=ITP.log.slice(0,30);
  rItp();
  if(ITP.auto){if(dir==='x')itpTTS(r.t,'tr-TR');else itpTTS(r.t,ITP_L.lc);}
}
function itpListen(dir){
  try{speechSynthesis.cancel();}catch(e){}
  if(!SR){ITP.msg='Bu tarayıcı mikrofonla konuşmayı desteklemiyor. Aşağıya yazarak çevirebilirsin.';rItp();return;}
  let got=false;ITR=new SR();ITR.lang=dir==='x'?ITP_L.lc:'tr-TR';ITR.interimResults=false;ITR.maxAlternatives=1;
  ITP.listening=dir;ITP.msg='';rItp();
  ITR.onresult=e=>{got=true;try{itpDo(e.results[0][0].transcript,dir);}catch(x){}};
  ITR.onerror=e=>{ITP.listening=null;ITP.msg=(e.error==='not-allowed'||e.error==='service-not-allowed')?'Mikrofon izni verilmedi. Tarayıcı ayarlarından izin ver.':(e.error==='no-speech'?'Ses duyulmadı, tekrar dene.':'Mikrofon hatası: '+(e.error||''));rItp();};
  ITR.onend=()=>{if(!got&&ITP.listening){ITP.listening=null;if(!ITP.msg)ITP.msg='Ses duyulmadı, tekrar dene.';rItp();}};
  try{ITR.start();}catch(e){ITP.listening=null;ITP.msg='Mikrofon başlatılamadı.';rItp();}
}

let FM=null;

function fmQuiz(){
  const R=FAMD.roots,A=FAMD.aff,items=[];
  const pick=(arr,n)=>fmShuf(arr).slice(0,n);
  // 1) kelime -> kök
  pick(R,6).forEach(r=>{const w=pick(r.w,1)[0];if(!w)return;const wr=pick(R.filter(x=>x!==r),3).map(x=>x.r);items.push({q:'«'+w[0]+'» ('+w[1]+') hangi kökten türedi?',a:r.r,o:fmShuf([r.r,...wr]),say:w[0]});});
  // 2) ek -> anlam
  pick(A,5).forEach(a=>{const wr=pick(A.filter(x=>x.tr!==a.tr),3).map(x=>x.tr);items.push({q:'«'+a.a+'» eki ne anlam katar?',a:a.tr,o:fmShuf([a.tr,...wr])});});
  // 3) kök + ek -> kelime anlamı
  pick(A.filter(a=>a.ex&&a.ex.length),5).forEach(a=>{const e=pick(a.ex,1)[0];const wr=pick(A.filter(x=>x!==a&&x.ex&&x.ex.length).map(x=>x.ex[0][1]),3);if(wr.length<3)return;items.push({q:'«'+e[0]+'» ne demek? ('+a.a+' eki)',a:e[1],o:fmShuf([e[1],...wr]),say:e[0]});});

}

function rExam(){
  const d=DATA[CUR.l],qs=d.exam.q,E=CUR;
  if(E.k>=qs.length){
    const pts=Math.round(E.sc*100/qs.length),pass=pts>=d.exam.pass;if(S.ex[CUR.l]===undefined||pts>S.ex[CUR.l])S.ex[CUR.l]=pts;bump();save();
    const nx=NEXT[d.level];
    $('#app').innerHTML=`<h2>🎓 Sınav sonucu</h2><div class="card" style="text-align:center"><div style="font-size:48px;font-weight:800">${pts}</div><div>${E.sc} / ${qs.length} doğru</div><p><b>${pass?'🎉 Geçtin!':'Baraj %80. Biraz daha çalışıp tekrar dene 💪'}</b></p></div>${pass&&nx?`<button id="up">${nx} seviyesine geç ➜</button> `:''}<button class="ghost" id="bk">Hikâyelere dön</button>`;
    if($('#up'))$('#up').onclick=()=>{S.lvl=nx;save();view='story';render();};
    $('#bk').onclick=()=>{view='story';render();};return;}
  const q=qs[E.k];
  $('#app').innerHTML=`<p class="sub">${d.level} Sınavı • Soru ${E.k+1} / ${qs.length}</p><div class="bar"><i style="width:${E.k/qs.length*100}%"></i></div><div class="card"><b style="font-size:18px">${esc(q.q)}</b><div id="os">${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div><div id="nx"></div></div><button class="ghost sm" id="qt">Sınavdan çık</button>`;
  $('#qt').onclick=()=>{view='story';render();};
  document.querySelectorAll('#os .opt').forEach(b=>b.onclick=()=>{
    if(E.sel!==null)return;E.sel=+b.dataset.i;const ok=E.sel===q.a;if(ok){E.sc++;xpa(2);}else misAdd({t:'x',q:q.q,o:q.o,a:q.o[q.a]});
    document.querySelectorAll('#os .opt').forEach(x=>{if(+x.dataset.i===q.a)x.classList.add('ok');else if(x===b)x.classList.add('bad');});
    $('#nx').innerHTML=`<button id="nb">${E.k+1>=qs.length?'Bitir':'Sonraki'} ➜</button>`;
    $('#nb').onclick=()=>{E.k++;E.sel=null;rExam();};
  });
}

// Görünmez parmak izi: kopyalanan metinden üye numarası okunabilir (admin/decode.js)
function tag(){let t='\u2060';for(let b=7;b>=0;b--)t+=((WID>>b)&1)?'\u200c':'\u200b';return t;}
function mark(x){
  if(typeof x!=='string'||x.length<60||!WID)return x;
  const t=tag(),pos=[.2,.5,.8].map(f=>Math.floor(x.length*f));let out=x,add=0;
  for(const p of pos){let i=out.indexOf(' ',p+add);if(i<0||i+3>=out.length)continue;i+=2;if(out[i-1]===' '||out[i]===' ')continue;out=out.slice(0,i)+t+out.slice(i);add+=t.length;}
  return out;
}
function stamp(d){if(!WID)return d;(d.stories||[]).forEach(s=>{s.en=mark(s.en);s.tr=mark(s.tr);});(d.practice||[]).forEach(p=>{p.text=mark(p.text);});return d;}
const KEYS=[];const KSALT='bdef000529e9bbe9c093820be1d91a7a';const API='https://ecoach.englishcoach-app.workers.dev';
function devId(){let d='';try{d=localStorage.getItem('ec_dev')||'';}catch(e){}if(!d){d=hexs(crypto.getRandomValues(new Uint8Array(16)));try{localStorage.setItem('ec_dev',d);}catch(e){}}return d;}
let LK={},WM='',WID=0,WEXP='',GERR='';
const b64=s=>Uint8Array.from(atob(s.trim()),c=>c.charCodeAt(0));
const hexb=s=>Uint8Array.from(s.match(/../g),x=>parseInt(x,16));
const hexs=u=>[...u].map(x=>x.toString(16).padStart(2,'0')).join('');
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function tryCode(code){
  code=normCode(code);if(code.length!==10||!(window.crypto&&crypto.subtle))return null;
  try{
    const sub=crypto.subtle,base=await sub.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveBits']);
    const bits=new Uint8Array(await sub.deriveBits({name:'PBKDF2',salt:hexb(KSALT),iterations:150000,hash:'SHA-256'},base,512));
    const tg=hexs(bits.slice(0,16));TG=tg;let W,X='';
    if(API){
      try{const r=await fetch(API+'/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t:tg,d:devId(),a:'es'})}),j=await r.json();
        if(!r.ok){GERR=j.e||'bad';if(j.e==='bad'||j.e==='exp'){try{localStorage.removeItem('ec_w');}catch(e){}}return null;}
        W=j.w;X=j.x||'';try{localStorage.setItem('ec_w',tg+'|'+W+'|'+X);}catch(e){}
      }catch(e){let c='';try{c=localStorage.getItem('ec_w')||'';}catch(x){}const p=c.split('|');if(p[0]!==tg||!p[1]){GERR='net';return null;}W=p[1];X=p[2]||'';}
    }else{const e=KEYS.find(k=>k.t===tg);if(!e)return null;W=e.w;}
    const wk=await sub.importKey('raw',bits.slice(32),'AES-GCM',false,['decrypt']),raw=b64(W);
    const o=JSON.parse(new TextDecoder().decode(await sub.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},wk,raw.slice(12))));
    if(!API&&o.x&&Date.now()>Date.parse(o.x+'T23:59:59')){GERR='exp';return null;}
    LK={};for(const l in o.k)LK[l]=await sub.importKey('raw',b64(o.k[l]),'AES-GCM',false,['decrypt']);WM=o.l;WID=o.i||0;WEXP=X||o.x||'';GERR='';return code;
  }catch(e){return null;}
}
function setWM(){
  let w=$('#wm');if(!w){w=document.createElement('div');w.id='wm';w.style.cssText='position:fixed;inset:0;pointer-events:none;opacity:.07;z-index:9';document.body.appendChild(w);}
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="230" height="130"><text x="115" y="70" text-anchor="middle" font-size="17" font-family="sans-serif" transform="rotate(-20 115 65)">${esc(WM)}</text></svg>`;
  w.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
function gmsg(){return GERR==='exp'?'Bu kodun süresi dolmuş. Yenisini iste.':GERR==='dev'?'Bu kod zaten en fazla sayıda cihazda kullanılıyor. Davet eden kişiden sıfırlamasını iste.':GERR==='rate'?'Çok fazla deneme. Biraz sonra tekrar dene.':GERR==='net'?'Sunucuya ulaşılamadı. İnternetini kontrol et.':(window.crypto&&crypto.subtle)?'Kod geçersiz.':'Bu tarayıcı güvenli bağlantı gerektiriyor (https).';}
function showLogin(msg){
  $('#nav').style.display='none';
  $('#app').innerHTML=`<h1>İspanyolca Koç</h1><p class="sub">Üyelere özel. Sana verilen kodu yaz.</p><div class="card"><input id="cd" placeholder="XXXXX-XXXXX" autocapitalize="characters" autocomplete="off" style="width:100%;font:inherit;font-size:22px;letter-spacing:2px;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px"><div style="height:10px"></div><button id="lg" style="width:100%">Giriş</button><p id="lm" class="small" style="color:#dc2626">${msg||''}</p></div><p class="small">Kodun yoksa seni davet eden kişiden iste. Kod kişiye özeldir. İçerik yalnızca kişisel kullanım içindir; kopyalanması, çoğaltılması ve paylaşılması yasaktır. Kopyalanan içerik kodunuza kadar izlenebilir.</p>`;
  const go=async()=>{const c=$('#cd').value;$('#lm').textContent='Kontrol ediliyor…';const ok=await tryCode(c);if(!ok){$('#lm').textContent=gmsg();return;}try{localStorage.setItem('ec_code',ok);}catch(e){}startApp();};
  $('#lg').onclick=go;$('#cd').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
}
function startApp(){$('#nav').style.display='';setWM();render();setTimeout(autoBackup,4000);}
async function boot(){
  let c='';try{c=localStorage.getItem('ec_code')||'';}catch(e){}
  if(c&&await tryCode(c)){startApp();return;}
  showLogin(GERR?gmsg():c?'Kodun artık geçerli değil.':'');
}
function logout(){try{localStorage.removeItem('ec_code');}catch(e){}LK={};WID=0;try{localStorage.removeItem('ec_w');}catch(e){}Object.keys(DATA).forEach(k=>delete DATA[k]);const w=$('#wm');if(w)w.remove();duelLeave();view='home';showLogin();}
boot();
